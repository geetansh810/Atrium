# nginx config for the production web/Dockerfile (static SPA).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router runs client-side, so unknown paths
    # (e.g. /tasks/:id on a hard refresh) must resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted build assets; never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
