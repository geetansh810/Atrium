services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: atrium
      POSTGRES_USER: atrium
      POSTGRES_PASSWORD: atrium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrium -d atrium"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build: core-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/atrium
      DATABASE_USER: atrium
      DATABASE_PASSWORD: atrium
      # M3.2 (08 §Security rule 6): the app's own runtime connection — not
      # Flyway's — uses the least-privilege role V10__tenant_rls.sql creates,
      # so Postgres RLS actually applies to it (it can never apply to the
      # bootstrap DATABASE_USER above). Override both in any shared env.
      ATRIUM_APP_DB_USER: ${ATRIUM_APP_DB_USER:-atrium_app}
      ATRIUM_APP_DB_PASSWORD: ${ATRIUM_APP_DB_PASSWORD:-atrium_app}
      REDIS_URL: redis://redis:6379
      # LLM provider keys (13 §1) — read from a root .env file (Compose auto-loads
      # it) or the shell environment. Never set a default here; a blank value is
      # the correct "not configured" state (ProviderReadiness.isReady()=false).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
