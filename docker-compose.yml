# LOCAL full-stack, one command: `docker compose up`. Clones run with zero extra
# setup — Postgres (pgvector), Redis, the Spring Boot core-api, and the web dev
# server all come up together. Add a GOOGLE_API_KEY to a root .env (copy from
# .env.example) if you want agents to actually run work; without any LLM key they
# park idle, which is the correct "not configured" state.
#
# PROD is a different shape entirely: backend on Render (render.yaml), frontend on
# Netlify (netlify.toml). Same core-api Docker image — behavior differs by env
# (SPRING_PROFILES_ACTIVE, DB/Redis/CORS URLs). See DEPLOYMENT.md.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: atrium
      POSTGRES_USER: atrium
      POSTGRES_PASSWORD: atrium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrium -d atrium"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build: core-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/atrium
      DATABASE_USER: atrium
      DATABASE_PASSWORD: atrium
      # M3.2 (08 §Security rule 6): the app's own runtime connection — not
      # Flyway's — uses the least-privilege role V10__tenant_rls.sql creates,
      # so Postgres RLS actually applies to it (it can never apply to the
      # bootstrap DATABASE_USER above). Override both in any shared env.
      ATRIUM_APP_DB_USER: ${ATRIUM_APP_DB_USER:-atrium_app}
      ATRIUM_APP_DB_PASSWORD: ${ATRIUM_APP_DB_PASSWORD:-atrium_app}
      REDIS_URL: redis://redis:6379
      # Local uses the default profile (human-readable logs). Prod (Render) sets
      # this to `prod` for structured JSON logs — see render.yaml. Overridable
      # from a root .env if you want to test prod logging locally.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # LLM provider keys (13 §1) — read from a root .env file (Compose auto-loads
      # it) or the shell environment. Never set a default here; a blank value is
      # the correct "not configured" state (ProviderReadiness.isReady()=false).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Web frontend — Vite dev server with hot reload (LOCAL only; prod is Netlify).
  web:
    build:
      context: web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      # The browser runs on the host, so it reaches core-api via the published
      # host port below. These match web/src/shared/config.ts defaults; set
      # explicitly so a fresh clone needs no web/.env.local.
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      VITE_USE_MOCKS: "0"
    volumes:
      - ./web:/app          # live-edit source → HMR
      - /app/node_modules   # keep the image's node_modules; don't shadow with the host's
    depends_on:
      - core-api

volumes:
  pgdata:
