spring:
  application:
    name: atrium-core-api
  datasource:
    # M3.2 (08 §Security rule 6): the app's own runtime connection uses the
    # least-privilege atrium_app role V10__tenant_rls.sql creates and grants
    # everything to — NOT the bootstrap DATABASE_USER, which Postgres refuses
    # to ever strip SUPERUSER from (RLS never applies to a superuser
    # regardless of FORCE). Flyway keeps the bootstrap creds below.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atrium}
    username: ${ATRIUM_APP_DB_USER:atrium_app}
    password: ${ATRIUM_APP_DB_PASSWORD:atrium_app}
  jpa:
    hibernate:
      ddl-auto: validate        # schema is Flyway's job, never Hibernate's
    open-in-view: false
  flyway:
    # Explicit user/password (not just locations) — needs the bootstrap role's
    # real DDL privileges (CREATE EXTENSION, CREATE ROLE, GRANT) that
    # atrium_app deliberately doesn't have.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atrium}
    user: ${DATABASE_USER:atrium}
    password: ${DATABASE_PASSWORD:atrium}
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

atrium:
  product-name: ${PRODUCT_NAME:Atrium}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  jwt:
    # HS256 needs >=32 bytes. This dev fallback is intentionally committed and
    # INSECURE — ATRIUM_JWT_SECRET must be set to a real random secret in any
    # shared/staging/prod environment (08 §Config).
    secret: ${ATRIUM_JWT_SECRET:dev-only-insecure-jwt-secret-override-me-in-any-shared-environment}
    expiry-days: 30
  lease:
    reclaim-ms: 60000       # LeaseReclaimJob sweep interval (03 §reclaim: every minute)
  relay:
    interval-ms: 250        # OutboxRelay poll interval (12 §3)
    retention-cron: "0 0 3 * * *"   # OutboxRetentionJob: nightly at 3am (15 §2)
  llm:
    timeout: ${ATRIUM_LLM_TIMEOUT:120s}     # per-call cap, enforced by LlmRouter (13 §1)
    retry:                                  # 13 §1.3 in-attempt schedules
      rate-limited-backoff: 2s,8s,30s
      provider-down-backoff: 5s,20s
    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}        # secret — never logged, never in prompts
    google:
      base-url: ${GOOGLE_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GOOGLE_API_KEY:}           # secret — never logged, never in prompts
  embeddings:
    provider: ${EMBEDDINGS_PROVIDER:openai}
    model: ${EMBEDDINGS_MODEL:text-embedding-3-small}   # 1536-dim, matches memories/knowledge_chunks vector(1536)
    timeout: ${ATRIUM_EMBEDDINGS_TIMEOUT:10s}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}          # secret — never logged, never in prompts
  memory:
    ttl-days: ${ATRIUM_MEMORY_TTL_DAYS:90}          # 14 §2: lesson/summary memories unused this long get archived
    archive-cron: "0 30 3 * * *"                    # MemoryTtlArchiver: nightly at 3:30am
  learning:
    model-tier: ${ATRIUM_LEARNING_MODEL_TIER:fast}  # 14 §5: extraction uses the agent's own provider, fast tier
    poll-interval-ms: 5000                          # LearningPipeline poll cadence (12 §3 durable consumer)
    batch-size: 5                                   # kept small: each event's LLM call runs inside the batch's shared tx
  stats-rollup:
    poll-interval-ms: 5000                          # StatsRollupWorker poll cadence (12 §3 durable consumer, M2.3)
    batch-size: 50                                  # no LLM calls in this consumer, safe to batch larger than learning's
    reconcile-cron: "0 15 3 * * *"                  # StatsRollupReconciliationJob: nightly at 3:15am (17 §M2.3)

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    app.atrium: DEBUG
    org.hibernate.SQL: DEBUG
