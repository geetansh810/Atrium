spring:
  application:
    name: atrium-core-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atrium}
    username: ${DATABASE_USER:atrium}
    password: ${DATABASE_PASSWORD:atrium}
  jpa:
    hibernate:
      ddl-auto: validate        # schema is Flyway's job, never Hibernate's
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

atrium:
  product-name: ${PRODUCT_NAME:Atrium}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  lease:
    reclaim-ms: 60000       # LeaseReclaimJob sweep interval (03 §reclaim: every minute)
  relay:
    interval-ms: 250        # OutboxRelay poll interval (12 §3)
    retention-cron: "0 0 3 * * *"   # OutboxRetentionJob: nightly at 3am (15 §2)
  llm:
    timeout: ${ATRIUM_LLM_TIMEOUT:120s}     # per-call cap, enforced by LlmRouter (13 §1)
    retry:                                  # 13 §1.3 in-attempt schedules
      rate-limited-backoff: 2s,8s,30s
      provider-down-backoff: 5s,20s
    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}        # secret — never logged, never in prompts

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    app.atrium: DEBUG
    org.hibernate.SQL: DEBUG
