spring:
  application:
    name: atrium-core-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atrium}
    username: ${DATABASE_USER:atrium}
    password: ${DATABASE_PASSWORD:atrium}
  jpa:
    hibernate:
      ddl-auto: validate        # schema is Flyway's job, never Hibernate's
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

atrium:
  product-name: ${PRODUCT_NAME:Atrium}
  base-url: ${APP_BASE_URL:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    app.atrium: DEBUG
    org.hibernate.SQL: DEBUG
